[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nougenscript"
version = "0.3.0"
description = "Universal Poly-Script Engine: Movie, TV, Playwriting, Comic, Email, TypeScript, JavaScript, and Python scripts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dave Meralus", email = "dave@nougenai.com"},
    {name = "Who Visions LLC"}
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-java>=0.23,<0.24",
]

[project.scripts]
nougenscript = "nougenscript.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
